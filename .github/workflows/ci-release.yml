name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic-version tag to publish
        required: true
        type: string

# Pousser deux fois en une minute lançait deux matrices complètes en parallèle,
# dont la première ne servait plus à rien. La branche par défaut est exclue de
# l'annulation : une release à moitié publiée est pire qu'un run gaspillé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Le minimum par défaut ; seul le job qui publie est élevé.
permissions:
  contents: read

jobs:
  version:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate declared version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < version.txt)
          printf '%s\n' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$VERSION" = "$RELEASE_TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  host-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate release policy
        run: |
          python3 test_host/test_release_workflow.py
          bash test_host/test_release_string_check.sh

      - name: Compile and run microphone PCM and GPIO safety tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I components/pogmic/include \
            test_host/test_pogmic_pcm.c components/pogmic/pogmic_pcm.c -lm \
            -o /tmp/pog-airplay-mic-test
          /tmp/pog-airplay-mic-test

      - name: Test voice framing, trust boundaries and sample-rate conversion
        run: |
          # gnu11 et non c11 : sur glibc, math.h ne declare M_PI que sous
          # _DEFAULT_SOURCE. macOS l'expose meme en C strict, d'ou un test
          # vert en local et rouge en CI.
          cc -std=gnu11 -fsanitize=address,undefined -c components/audio-resampler/resampler.c -o /tmp/pog-resampler.o
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I components/pogvoice/include -I components/audio-resampler \
            test_host/test_pogvoice.c components/pogvoice/pogvoice_protocol.c \
            components/pogvoice/pogvoice_resample.c /tmp/pog-resampler.o -lm -o /tmp/pog-voice-test
          /tmp/pog-voice-test

      # La politique de survie du lien MQTT est pure (pogdev_retry.c) : elle se
      # vérifie ici sans ESP-IDF ni matériel, comme hub_retry chez pog-os-vox.
      - name: Compile and run pogdev retry policy tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I components/pogdev/include \
            test_host/test_pogdev_retry.c components/pogdev/pogdev_retry.c \
            -o /tmp/pog-airplay-retry-test
          /tmp/pog-airplay-retry-test

      - name: Compile and run effect synchronization tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I main \
            test_host/test_effect_sync.c main/effect_sync.c -lm \
            -o /tmp/pog-airplay-effect-sync-test
          /tmp/pog-airplay-effect-sync-test

      - name: Compile and run addressable light policy tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I main \
            test_host/test_led_argb_policy.c main/led_argb_policy.c \
            -o /tmp/pog-airplay-led-policy-test
          /tmp/pog-airplay-led-policy-test

  format-check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Check web UI completeness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("data/www/index.html").read_text(encoding="utf-8")
          required = (
              "</script></body></html>",
              "data-tab='systeme'",
              "function startOTA()",
              "function installLatestOTA()",
          )
          missing = [marker for marker in required if marker not in page]
          if missing:
              raise SystemExit(f"data/www/index.html is incomplete; missing: {missing}")
          if not page.rstrip().endswith("</script></body></html>"):
              raise SystemExit("data/www/index.html is truncated after its closing document")
          PY

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find main components -path components/u8g2 -prune -o \( -name "*.c" -o -name "*.h" \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  lint-check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Build and generate compile_commands.json
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Run clang-tidy
        run: |
          COMPILE_DB="build"
          WARNINGS=0
          while IFS= read -r -d '' file; do
            echo "Checking $file..."
            OUTPUT=$(clang-tidy -p "$COMPILE_DB" "$file" 2>&1 || true)
            FILTERED=$(echo "$OUTPUT" | grep -v "file not found \[clang-diagnostic" || true)
            if echo "$FILTERED" | grep -q ": warning:"; then
              echo "$FILTERED" | grep -E "(: warning:|: note:)"
              WARNINGS=1
            fi
          done < <(find main components -path components/u8g2 -prune -o \( -name "*.c" -o -name "*.h" \) -print0)
          if [ "$WARNINGS" -ne 0 ]; then
            echo ""
            echo "clang-tidy found issues"
            exit 1
          fi
          echo "All files pass clang-tidy checks"

  # Le dépôt se construit de DEUX façons : idf.py (ci-dessous) et PlatformIO,
  # qui est ce qu'on utilise sur le bureau. Elles ne lisent pas la même chose —
  # PlatformIO a son propre cache CMake et ne relit pas le CMakeLists.txt d'un
  # composant quand une source y est ajoutée. Une dépendance circulaire entre
  # composants, que CMake écarte en silence, passe donc inaperçue côté idf.py et
  # casse le lien côté PlatformIO. Sans ce job, ce genre de panne ne se découvre
  # que sur le bureau de quelqu'un, longtemps après.
  platformio-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Repartir d'un cache CMake vide, précisément parce que c'est le cache qui
      # masque le défaut qu'on cherche.
      - name: Build xiao-s3 from scratch
        run: |
          rm -rf .pio/build
          pio run -e xiao-s3
          pio run -e n16r8

      - name: Build WROVER-E firmware and compact filesystem
        run: |
          pio run -e wrover-e
          pio run -e wrover-e -t buildfs
          pio run -e wrover-e-voice
          pio run -e wrover-e-voice -t buildfs

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, platformio-build, version, host-tests]
    strategy:
      fail-fast: false
      matrix:
        # `name` -> asset suffix; `env` -> what the desktop app calls the board;
        # `target` -> esp chip; `flash_size`/`label` feed the manifest the app reads.
        include:
          - name: esp32s3
            env: esp32s3
            target: esp32s3
            flash_size: "16MB"
            label: "ESP32-S3 DevKitC-1 (16 Mo)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32s3"
          - name: pog-s3
            env: pog-s3
            target: esp32s3
            flash_size: "16MB"
            label: "POG ESP32-S3 N16R8 (MAX98357A sur 4/5/7)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.pog-s3"
          - name: pog-s3-voice
            env: pog-s3-voice
            target: esp32s3
            flash_size: "16MB"
            label: "POG ESP32-S3 N16R8 satellite vocal"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.pog-s3;sdkconfig.defaults.pog-s3-voice"
          - name: xiao-s3
            env: xiao-s3
            target: esp32s3
            flash_size: "8MB"
            label: "Seeed XIAO ESP32-S3 (8 Mo)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.xiao"
          - name: n16r8
            env: n16r8
            target: esp32s3
            flash_size: "16MB"
            label: "POG AirPlay N16R8 (MAX98357A, 16 Mo)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.n16r8"
          - name: squeezeamp-bt
            env: squeezeamp
            target: esp32
            flash_size: "8MB"
            label: "SqueezeAMP (ESP32, BT, 8 Mo)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.squeezeamp;sdkconfig.defaults.bt"
          - name: wrover-e
            env: wrover-e
            target: esp32
            flash_size: "4MB"
            label: "ESP32-WROVER-E (4 Mo, PSRAM)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.wrover-e"
          - name: wrover-e-voice
            env: wrover-e-voice
            target: esp32
            flash_size: "4MB"
            label: "ESP32-WROVER-E vocal (I2S 32/33/25/35, 4 Mo)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.wrover-e;sdkconfig.defaults.wrover-e-voice"
          # squeezeamp-4m is intentionally omitted: the web-UI SPIFFS image
          # overflows the 4 MB layout's ~188 KB storage partition
          # (SpiffsFullError). Re-add once the 4 MB `data/www` is trimmed or the
          # storage partition enlarged in partitions-4m.csv.
          - name: esparagus-audio-brick-bt
            env: esparagus-audio-brick
            target: esp32
            flash_size: "8MB"
            label: "Esparagus Audio Brick (ESP32, BT)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esparagus-audio-brick;sdkconfig.defaults.bt"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set firmware version
        run: echo "${{ needs.version.outputs.version }}" > version.txt

      # Build the app, then produce TWO artifacts per board:
      #   firmware-<name>.bin -> app-partition image, for OTA (POST /api/ota/update)
      #   merged-<name>.bin   -> full flash image (esptool merge_bin), for USB serial at 0x0
      - name: Build ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          command: >
            idf.py -DSDKCONFIG_DEFAULTS="${{ matrix.sdkconfig }}" build &&
            mkdir -p dist &&
            ( cd build && esptool.py --chip ${{ matrix.target }} merge_bin --format raw -o merged.bin $(cat flash_args) ) &&
            cp build/merged.bin dist/merged-${{ matrix.name }}.bin &&
            cp build/airplay2-receiver.bin dist/firmware-${{ matrix.name }}.bin

      - name: Verify embedded firmware version
        run: |
          EXPECTED="${{ needs.version.outputs.version }}"
          if ! strings "dist/firmware-${{ matrix.name }}.bin" | grep -Fx "$EXPECTED" >/dev/null; then
            echo "firmware-${{ matrix.name }}.bin does not embed version $EXPECTED"
            exit 1
          fi

      - name: Write manifest fragment
        run: |
          # dist/ and its .bin files were created by the esp-idf-ci-action
          # container as root; take ownership so this host step can write into it.
          mkdir -p dist
          sudo chown -R "$(id -u):$(id -g)" dist
          # L'empreinte est calculée ICI, là où le binaire vient d'être produit.
          # Un flasher qui écrit 8 Mo sur une carte doit pouvoir vérifier qu'il
          # écrit bien ce que la CI a construit : sans elle, il ne peut faire
          # confiance qu'au transport, et un téléchargement tronqué se solde par
          # une carte muette qu'il faut rattraper au câble.
          MERGED_SHA=$(sha256sum "dist/merged-${{ matrix.name }}.bin" | cut -d" " -f1)
          APP_SHA=$(sha256sum "dist/firmware-${{ matrix.name }}.bin" | cut -d" " -f1)
          MERGED_SIZE=$(stat -c%s "dist/merged-${{ matrix.name }}.bin")

          cat > "dist/manifest-${{ matrix.name }}.json" <<EOF
          {
            "env": "${{ matrix.env }}",
            "label": "${{ matrix.label }}",
            "chip": "${{ matrix.target }}",
            "flashSize": "${{ matrix.flash_size }}",
            "app": "firmware-${{ matrix.name }}.bin",
            "appSha256": "${APP_SHA}",
            "merged": "merged-${{ matrix.name }}.bin",
            "mergedSha256": "${MERGED_SHA}",
            "mergedSize": ${MERGED_SIZE}
          }
          EOF

  dispatch-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag source and dispatch trusted publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "v$(tr -d '[:space:]' < version.txt)" = "$VERSION"
          TAG_COMMIT=$(git rev-parse "${VERSION}^{commit}")
          test "$TAG_COMMIT" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh workflow run ci-release.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f "release_tag=$VERSION"

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on:
      group: POG Release trusted
      labels: pog-release-linux-x64
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}
          submodules: recursive
      - name: Validate immutable release source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "v$(tr -d '[:space:]' < version.txt)" = "$VERSION"
          TAG_COMMIT=$(git rev-parse "${VERSION}^{commit}")
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          echo "SOURCE_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"
      - name: Rebuild every release image from the tag
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          command: >-
            scripts/package_release_all.sh "$(cat version.txt)" "$(git rev-parse HEAD)";
            rc=$?;
            chown -R --reference=. dist build sdkconfig 2>/dev/null || true;
            exit $rc
      - name: Publish one immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "POG OS AirPlay $VERSION" --generate-notes
