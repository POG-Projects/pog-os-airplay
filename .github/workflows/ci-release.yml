name: CI & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  # Pour recouper une release sans avoir à pousser un commit vide.
  workflow_dispatch:

# Pousser deux fois en une minute lançait deux matrices complètes en parallèle,
# dont la première ne servait plus à rien. La branche par défaut est exclue de
# l'annulation : une release à moitié publiée est pire qu'un run gaspillé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Le minimum par défaut ; seul le job qui publie est élevé.
permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Check web UI completeness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("data/www/index.html").read_text(encoding="utf-8")
          required = (
              "</script></body></html>",
              "data-tab='systeme'",
              "function startOTA()",
              "function installLatestOTA()",
          )
          missing = [marker for marker in required if marker not in page]
          if missing:
              raise SystemExit(f"data/www/index.html is incomplete; missing: {missing}")
          if not page.rstrip().endswith("</script></body></html>"):
              raise SystemExit("data/www/index.html is truncated after its closing document")
          PY

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find main components -path components/u8g2 -prune -o \( -name "*.c" -o -name "*.h" \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Build and generate compile_commands.json
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Run clang-tidy
        run: |
          COMPILE_DB="build"
          WARNINGS=0
          while IFS= read -r -d '' file; do
            echo "Checking $file..."
            OUTPUT=$(clang-tidy -p "$COMPILE_DB" "$file" 2>&1 || true)
            FILTERED=$(echo "$OUTPUT" | grep -v "file not found \[clang-diagnostic" || true)
            if echo "$FILTERED" | grep -q ": warning:"; then
              echo "$FILTERED" | grep -E "(: warning:|: note:)"
              WARNINGS=1
            fi
          done < <(find main components -path components/u8g2 -prune -o \( -name "*.c" -o -name "*.h" \) -print0)
          if [ "$WARNINGS" -ne 0 ]; then
            echo ""
            echo "clang-tidy found issues"
            exit 1
          fi
          echo "All files pass clang-tidy checks"

  # Le dépôt se construit de DEUX façons : idf.py (ci-dessous) et PlatformIO,
  # qui est ce qu'on utilise sur le bureau. Elles ne lisent pas la même chose —
  # PlatformIO a son propre cache CMake et ne relit pas le CMakeLists.txt d'un
  # composant quand une source y est ajoutée. Une dépendance circulaire entre
  # composants, que CMake écarte en silence, passe donc inaperçue côté idf.py et
  # casse le lien côté PlatformIO. Sans ce job, ce genre de panne ne se découvre
  # que sur le bureau de quelqu'un, longtemps après.
  platformio-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Repartir d'un cache CMake vide, précisément parce que c'est le cache qui
      # masque le défaut qu'on cherche.
      - name: Build xiao-s3 from scratch
        run: |
          rm -rf .pio/build
          pio run -e xiao-s3

  build:
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, platformio-build]
    strategy:
      fail-fast: false
      matrix:
        # `name` -> asset suffix; `env` -> what the desktop app calls the board;
        # `target` -> esp chip; `flash_size`/`label` feed the manifest the app reads.
        include:
          - name: esp32s3
            env: esp32s3
            target: esp32s3
            flash_size: "16MB"
            label: "ESP32-S3 DevKitC-1 (16 Mo)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32s3"
          - name: xiao-s3
            env: xiao-s3
            target: esp32s3
            flash_size: "8MB"
            label: "Seeed XIAO ESP32-S3 (8 Mo)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.xiao"
          - name: squeezeamp-bt
            env: squeezeamp
            target: esp32
            flash_size: "8MB"
            label: "SqueezeAMP (ESP32, BT, 8 Mo)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.squeezeamp;sdkconfig.defaults.bt"
          # squeezeamp-4m is intentionally omitted: the web-UI SPIFFS image
          # overflows the 4 MB layout's ~188 KB storage partition
          # (SpiffsFullError). Re-add once the 4 MB `data/www` is trimmed or the
          # storage partition enlarged in partitions-4m.csv.
          - name: esparagus-audio-brick-bt
            env: esparagus-audio-brick
            target: esp32
            flash_size: "8MB"
            label: "Esparagus Audio Brick (ESP32, BT)"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esparagus-audio-brick;sdkconfig.defaults.bt"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      # Build the app, then produce TWO artifacts per board:
      #   firmware-<name>.bin -> app-partition image, for OTA (POST /api/ota/update)
      #   merged-<name>.bin   -> full flash image (esptool merge_bin), for USB serial at 0x0
      - name: Build ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          command: >
            idf.py -DSDKCONFIG_DEFAULTS="${{ matrix.sdkconfig }}" build &&
            mkdir -p dist &&
            ( cd build && esptool.py --chip ${{ matrix.target }} merge_bin --format raw -o merged.bin $(cat flash_args) ) &&
            cp build/merged.bin dist/merged-${{ matrix.name }}.bin &&
            cp build/airplay2-receiver.bin dist/firmware-${{ matrix.name }}.bin

      - name: Write manifest fragment
        run: |
          # dist/ and its .bin files were created by the esp-idf-ci-action
          # container as root; take ownership so this host step can write into it.
          mkdir -p dist
          sudo chown -R "$(id -u):$(id -g)" dist
          # L'empreinte est calculée ICI, là où le binaire vient d'être produit.
          # Un flasher qui écrit 8 Mo sur une carte doit pouvoir vérifier qu'il
          # écrit bien ce que la CI a construit : sans elle, il ne peut faire
          # confiance qu'au transport, et un téléchargement tronqué se solde par
          # une carte muette qu'il faut rattraper au câble.
          MERGED_SHA=$(sha256sum "dist/merged-${{ matrix.name }}.bin" | cut -d" " -f1)
          APP_SHA=$(sha256sum "dist/firmware-${{ matrix.name }}.bin" | cut -d" " -f1)
          MERGED_SIZE=$(stat -c%s "dist/merged-${{ matrix.name }}.bin")

          cat > "dist/manifest-${{ matrix.name }}.json" <<EOF
          {
            "env": "${{ matrix.env }}",
            "label": "${{ matrix.label }}",
            "chip": "${{ matrix.target }}",
            "flashSize": "${{ matrix.flash_size }}",
            "app": "firmware-${{ matrix.name }}.bin",
            "appSha256": "${APP_SHA}",
            "merged": "merged-${{ matrix.name }}.bin",
            "mergedSha256": "${MERGED_SHA}",
            "mergedSize": ${MERGED_SIZE}
          }
          EOF

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.name }}
          path: dist/*

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          BUMPED=false

          # Check if release with this version already exists
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, auto-incrementing..."
            LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
            LATEST_VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            NEW_PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            BUMPED=true
            echo "New version: $VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"

      - name: Assemble manifest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "{"
            echo "  \"version\": \"${VERSION}\","
            echo "  \"boards\": ["
            FIRST=1
            for f in $(ls dist/manifest-*.json | sort); do
              if [ $FIRST -eq 0 ]; then echo "    ,"; fi
              sed 's/^/    /' "$f"
              FIRST=0
            done
            echo "  ]"
            echo "}"
          } > dist/manifest.json
          rm -f dist/manifest-*.json
          echo "--- manifest.json ---"; cat dist/manifest.json
          echo "--- assets ---"; ls -l dist

      # Le manifeste est ce que lira le flasher : s'il est mal formé ou qu'il
      # cite une image absente, la panne se découvre au moment où quelqu'un
      # essaie d'écrire sur une carte. La release est le dernier endroit où on
      # peut encore refuser.
      - name: Validate manifest
        run: |
          python3 - <<'PY'
          import json, os, sys
          m = json.load(open("dist/manifest.json"))
          boards = m.get("boards") or []
          if not boards:
              sys.exit("manifest.json declares no board")
          seen = set()
          for b in boards:
              for key in ("env", "label", "chip", "flashSize", "app", "merged", "mergedSha256"):
                  if not b.get(key):
                      sys.exit(f"board {b.get('env', '?')}: missing {key}")
              if b["env"] in seen:
                  sys.exit(f"duplicate env {b['env']}")
              seen.add(b["env"])
              for key in ("app", "merged"):
                  path = os.path.join("dist", b[key])
                  if not os.path.isfile(path):
                      sys.exit(f"board {b['env']}: {b[key]} is declared but absent")
              size = os.path.getsize(os.path.join("dist", b["merged"]))
              if b.get("mergedSize") not in (None, size):
                  sys.exit(f"board {b['env']}: mergedSize {b['mergedSize']} != {size}")
          print(f"manifest.json: {len(boards)} board(s), every asset present")
          PY

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.bin manifest.json > SHA256SUMS
          cat SHA256SUMS

      - name: Update version.txt
        if: steps.version.outputs.bumped == 'true'
        run: |
          echo "${{ steps.version.outputs.version }}" > version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "Bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            dist/*.bin
            dist/manifest.json
            dist/SHA256SUMS
          make_latest: true
          generate_release_notes: true
